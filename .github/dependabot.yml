version: 2
updates:
  - package-ecosystem: npm
    directory: /obsidian-plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # pdfjs-dist >=6.3 requires Node >=22.13; Companion still supports Node 20.
      - dependency-name: pdfjs-dist
        versions: [">=6.3.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
