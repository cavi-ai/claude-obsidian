name: Obsidian plugin CI

on:
  push:
    branches: [main]
    paths:
      - "obsidian-plugin/**"
      - "claude-plugin"
      - "claude-plugin/**"
      - "CHANGELOG.md"
      - "README.md"
      - "guides/**"
      - "assets/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "native-ios/README.md"
      - "SECURITY.md"
      - "NOTICE"
      - "LICENSE"
      - ".github/workflows/release-obsidian-plugin.yml"
      - ".github/workflows/obsidian-plugin-ci.yml"
  pull_request:
    paths:
      - "obsidian-plugin/**"
      - "claude-plugin"
      - "claude-plugin/**"
      - "CHANGELOG.md"
      - "README.md"
      - "guides/**"
      - "assets/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "native-ios/README.md"
      - "SECURITY.md"
      - "NOTICE"
      - "LICENSE"
      - ".github/workflows/release-obsidian-plugin.yml"
      - ".github/workflows/obsidian-plugin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: obsidian-plugin

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      # The adapter drift test reads the pinned obsidian-agent registry; it skips
      # when the optional submodule is absent from a standalone plugin checkout.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: obsidian-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version lockstep
        run: pnpm run verify:version

      - name: Type-check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        if: matrix.node-version != '22.x'
        run: pnpm test

      - name: Test with coverage thresholds
        if: matrix.node-version == '22.x'
        run: pnpm run test:coverage

      - name: Audit dependencies
        if: matrix.node-version == '22.x'
        run: pnpm run audit

      - name: Verify the docs artifact contract
        run: pnpm run docs:verify

      - name: Verify the generated skill registry
        run: pnpm run skills:verify

      - name: Build
        run: pnpm run build

      - name: Enforce the production bundle budget
        run: pnpm run bundle:check

      - name: Verify the inlined embedding worker bundle
        run: pnpm run verify:worker-bundle

  e2e:
    name: e2e · real Obsidian (Linux)
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the Obsidian test image
        run: docker build --file e2e/rig/Dockerfile --tag companion-e2e .

      - name: Run the Playwright suite against Obsidian
        run: |
          mkdir -p "${{ runner.temp }}/e2e"
          docker run --rm --init \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace" \
            --mount type=volume,target=/workspace/obsidian-plugin/node_modules \
            --mount "type=bind,source=${{ runner.temp }}/e2e,target=/e2e-output" \
            companion-e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: ${{ runner.temp }}/e2e
