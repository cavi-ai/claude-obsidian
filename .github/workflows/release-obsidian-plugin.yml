name: Release Obsidian plugin

# Mirrors obsidian-plugin/ to cavi-ai/companion-for-claude and pushes the tag.
# That repo's release.yml builds, attests, and publishes.
# Needs RELEASE_REPO_TOKEN with contents:write on the release repo.

on:
  push:
    tags:
      - "obsidian-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match manifest.json, e.g. 0.5.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Tagging the monorepo needs write; the GITHUB_TOKEN push can't re-trigger this workflow.
    permissions:
      contents: write
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7

      # A tag push for an already-published version is a backfill, not a re-cut:
      # skip it instead of failing. An explicit dispatch still errors.
      - name: Resolve release state
        id: state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./obsidian-plugin/manifest.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="${{ github.event.inputs.version }}"
          else
            TRIGGER="${GITHUB_REF_NAME#obsidian-v}"
          fi
          echo "version=$TRIGGER" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TRIGGER" --repo cavi-ai/companion-for-claude >/dev/null 2>&1; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Release $TRIGGER already exists on cavi-ai/companion-for-claude. Delete the release and tag to re-cut it."
            exit 1
          fi
          echo "::notice::Release $TRIGGER already published; nothing to mirror for this tag."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          if [ "$TRIGGER" != "$VERSION" ]; then
            echo "::notice::Tag version $TRIGGER predates the current manifest version $VERSION."
          fi

      - name: Install pnpm
        if: steps.state.outputs.skip != 'true'
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.32.1

      - name: Use Node 22
        if: steps.state.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: obsidian-plugin/pnpm-lock.yaml

      - name: Install, verify, build
        if: steps.state.outputs.skip != 'true'
        working-directory: obsidian-plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run build
          test -f main.js

      # manifest, package.json, versions.json, and CHANGELOG must agree with the trigger.
      - name: Verify version lockstep
        if: steps.state.outputs.skip != 'true'
        working-directory: obsidian-plugin
        run: pnpm run verify:version "${{ steps.state.outputs.version }}"

      - name: Mirror source into the release repo
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./obsidian-plugin/manifest.json').version")"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/cavi-ai/companion-for-claude.git" release-repo
          # .github/ excluded: token has no workflow scope.
          # tools/ carries the release-facts generator the release repo's workflow runs.
          for dir in src test e2e assets tools; do
            rsync -a --delete "obsidian-plugin/$dir/" "release-repo/$dir/"
          done
          # guides/ becomes the docs member of the release artifact; cavi-home's
          # release ingest requires it and serves it as the product's docs.
          rsync -a --delete guides/ release-repo/guides/
          cp obsidian-plugin/package.json       release-repo/package.json
          cp obsidian-plugin/pnpm-lock.yaml     release-repo/pnpm-lock.yaml
          cp obsidian-plugin/tsconfig.json      release-repo/tsconfig.json
          cp obsidian-plugin/vitest.config.ts   release-repo/vitest.config.ts
          cp obsidian-plugin/esbuild.config.mjs release-repo/esbuild.config.mjs
          cp obsidian-plugin/eslint.config.mjs  release-repo/eslint.config.mjs
          cp obsidian-plugin/main.js            release-repo/main.js
          cp obsidian-plugin/manifest.json      release-repo/manifest.json
          cp obsidian-plugin/styles.css         release-repo/styles.css
          cp obsidian-plugin/versions.json      release-repo/versions.json
          cp obsidian-plugin/README.md          release-repo/README.md
          cp LICENSE                            release-repo/LICENSE
          printf 'node_modules/\n*.js.map\n.DS_Store\n.build/\n' > release-repo/.gitignore
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror."
          else
            git commit -m "release: v${VERSION}"
          fi
          git push origin HEAD:main

      # The tag triggers release.yml on the release repo.
      - name: Tag the release repo
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./obsidian-plugin/manifest.json').version")"
          cd release-repo
          if gh release view "$VERSION" --repo cavi-ai/companion-for-claude >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists on cavi-ai/companion-for-claude. Delete the release and tag to re-cut it."
            exit 1
          fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Wait for the release repo to publish
        if: steps.state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./obsidian-plugin/manifest.json').version")"
          for _ in $(seq 30); do
            if gh release view "$VERSION" --repo cavi-ai/companion-for-claude >/dev/null 2>&1; then
              echo "Release $VERSION published."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Release $VERSION never appeared. Check the Release workflow on cavi-ai/companion-for-claude."
          exit 1

      # Dispatch-cut releases left the monorepo untagged; a GITHUB_TOKEN push can't re-trigger this workflow.
      - name: Tag the monorepo
        if: steps.state.outputs.skip != 'true'
        run: |
          set -euo pipefail
          TAG="obsidian-v${{ steps.state.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already exists."
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
