name: README captures

# Generator only; CI e2e and readmeCaptureQuality are the gates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-captures-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: obsidian-plugin

jobs:
  capture:
    name: capture · real Obsidian (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the Obsidian test image
        run: docker build --file e2e/rig/Dockerfile --tag companion-e2e .

      - name: Capture the dark README scenes
        run: |
          mkdir -p "${{ runner.temp }}/captures" "${{ runner.temp }}/e2e"
          docker run --rm --init \
            --env CC_E2E_CAPTURE=1 \
            --env CC_E2E_CAPTURE_THEME=dark \
            --env CC_E2E_CAPTURE_DIR=/captures \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace" \
            --mount type=volume,target=/workspace/obsidian-plugin/node_modules \
            --mount "type=bind,source=${{ runner.temp }}/captures,target=/captures" \
            --mount "type=bind,source=${{ runner.temp }}/e2e,target=/e2e-output" \
            companion-e2e pnpm run e2e:captures

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readme-captures
          path: ${{ runner.temp }}/captures
          if-no-files-found: warn

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: readme-capture-traces
          path: ${{ runner.temp }}/e2e
